[project]
name = "space-trader"
version = "1.0.0"
description = "Космический Трейдер — многопользовательская космическая RPG-экономика для Telegram-групп"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [".venv", "data", "backups"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
# UP038 (isinstance с X | Y) ruff сам объявил устаревшим.
ignore = ["UP038"]

[tool.ruff.lint.isort]
known-first-party = ["app", "config", "tests"]

[tool.ruff.format]
quote-style = "double"
